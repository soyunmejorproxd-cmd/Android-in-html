<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Android in HTML - Launcher</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="launcher-root">
        
        <!-- Status Bar -->
        <header class="status-bar">
            <div id="clock">12:00</div>
            <div class="status-icons">
                <span class="material-symbols-outlined">wifi</span>
                <span class="material-symbols-outlined">signal_cellular_4_bar</span>
                <span class="material-symbols-outlined">battery_full</span>
            </div>
        </header>

        <!-- Home Screen (Workspace) -->
        <main class="home-screen" id="home-screen">
            <div class="at-a-glance">
                <div class="date-text" id="date-widget">Lun, 1 Ene</div>
                <div class="weather-text"><span class="material-symbols-outlined">partly_cloudy_day</span> 24°C</div>
            </div>
            
            <div class="workspace-grid">
                <!-- Espacio libre para futuros accesos directos o widgets -->
            </div>

            <!-- Dock / Favoritos -->
            <div class="dock-container">
                <div class="search-widget" onclick="toggleDrawer()">
                    <span class="logo">G</span>
                    <span class="search-placeholder">Buscar aplicaciones...</span>
                    <span class="material-symbols-outlined">mic</span>
                </div>
                <div class="dock-apps" id="dock-apps">
                    <!-- Apps ancladas se pueden generar aquí -->
                </div>
            </div>
        </main>

        <!-- App Drawer (Cajón de Aplicaciones) -->
        <section class="app-drawer" id="app-drawer">
            <div class="drawer-handle-container" onclick="toggleDrawer()">
                <div class="drawer-handle"></div>
            </div>
            
            <div class="drawer-search">
                <span class="material-symbols-outlined">search</span>
                <input type="text" id="app-search" placeholder="Buscar apps" oninput="filterApps()">
                <span class="material-symbols-outlined" onclick="toggleDrawer()">expand_more</span>
            </div>

            <div class="app-grid" id="app-grid">
                <!-- Los iconos se inyectarán aquí -->
            </div>
        </section>

        <!-- Gesture Navigation Bar -->
        <footer class="nav-bar" onclick="toggleDrawer()">
            <div class="nav-pill"></div>
        </footer>

    </div>

    <script>
        // Actualización de reloj y fecha
        function updateTime() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            const options = { weekday: 'short', month: 'short', day: 'numeric' };
            let dateStr = now.toLocaleDateString('es-ES', options);
            document.getElementById('date-widget').innerText = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
        }
        setInterval(updateTime, 1000);
        updateTime();

        // Lógica del Cajón de Aplicaciones
        const drawer = document.getElementById('app-drawer');
        const homeScreen = document.getElementById('home-screen');
        let allApps = [];

        function toggleDrawer() {
            drawer.classList.toggle('open');
            homeScreen.classList.toggle('dimmed');
            
            if(drawer.classList.contains('open')) {
                document.getElementById('app-search').focus();
            } else {
                document.getElementById('app-search').value = '';
                filterApps();
            }
        }

        // Renderizado de apps
        function renderApps(apps, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            
            apps.forEach(game => {
                const appItem = document.createElement('div');
                appItem.className = 'app-item';
                appItem.onclick = () => window.location.href = `game.html?id=${game.id}`;
                appItem.innerHTML = `
                    <div class="app-icon">
                        <span class="material-symbols-outlined">${game.icon}</span>
                    </div>
                    <span class="app-name">${game.name}</span>
                `;
                container.appendChild(appItem);
            });
        }

        // Búsqueda en el cajón
        function filterApps() {
            const query = document.getElementById('app-search').value.toLowerCase();
            const filtered = allApps.filter(app => app.name.toLowerCase().includes(query));
            renderApps(filtered, 'app-grid');
        }

        // Carga de datos
        async function loadApps() {
            try {
                const res = await fetch('games.json');
                if (!res.ok) throw new Error();
                allApps = await res.json();
            } catch (e) {
                // Fallback básico si falla el fetch local
                allApps = [
                    { "id": "chrome", "name": "Chrome", "url": "./Chrome/index.html", "icon": "language" },
                    { "id": "supreme-duelist-stickman", "name": "Supreme Duelist", "url": "./Supreme%20Duelist/index.html", "icon": "sports_kabaddi" }
                ];
            }

            renderApps(allApps, 'app-grid');
            
            // Renderizar un par de apps en el dock (ej. las primeras 4)
            renderApps(allApps.slice(0, 4), 'dock-apps');
        }

        window.onload = loadApps;
    </script>
</body>
</html>
