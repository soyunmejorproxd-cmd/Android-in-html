<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Android in HTML</title>
    
    <!-- Google Fonts & Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />
    
    <style>
        :root {
            /* Colores Material You / Wallpaper extraídos */
            --sys-color-background: #0f1416;
            --sys-color-surface: rgba(25, 28, 29, 0.75);
            --sys-color-on-surface: #e1e3e3;
            --sys-color-primary: #89d3df;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            user-select: none; /* Evita que el texto se seleccione como en una web normal */
        }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Simulador de Pantalla de Dispositivo */
        .device-screen {
            width: 100%;
            height: 100%;
            max-width: 412px; /* Ancho típico de un teléfono moderno */
            position: relative;
            background: linear-gradient(135deg, #1e3c45 0%, #0a181c 100%); /* Wallpaper simulado */
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        @media (min-width: 413px) {
            .device-screen {
                height: 90vh;
                border-radius: 32px;
                box-shadow: 0 0 0 12px #222, 0 20px 40px rgba(0,0,0,0.5); /* Simula el marco físico del celular en PC */
            }
        }

        /* Status Bar (Barra superior) */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            color: white;
            font-size: 14px;
            font-weight: 500;
            z-index: 10;
        }

        .status-icons {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .status-icons span {
            font-size: 16px;
        }

        /* At a Glance (Widget de fecha) */
        .at-a-glance {
            padding: 24px;
            color: white;
            font-size: 22px;
            font-weight: 400;
            text-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }

        /* App Grid (Cajón de aplicaciones) */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px 12px;
            padding: 0 24px;
            margin-top: 20px;
            flex-grow: 1;
            align-content: start;
            overflow-y: auto;
            /* Ocultar barra de scroll para mayor realismo */
            scrollbar-width: none; 
        }
        .app-grid::-webkit-scrollbar {
            display: none;
        }

        /* App Item */
        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            text-decoration: none;
            color: white;
            transition: transform 0.1s;
        }

        .app-item:active {
            transform: scale(0.9); /* Efecto de toque */
        }

        /* Contenedor del ícono (Preparado para imágenes futuras) */
        .app-icon {
            width: 60px;
            height: 60px;
            background-color: var(--sys-color-surface);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 22px; /* Squircle */
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--sys-color-primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .app-icon span {
            font-size: 32px;
        }

        .app-name {
            font-size: 12px;
            font-weight: 500;
            text-align: center;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 1px 2px rgba(0,0,0,0.6);
        }

        /* Barra de búsqueda (Search Pill) */
        .search-widget {
            margin: 24px;
            background-color: var(--sys-color-surface);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 28px;
            height: 56px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            color: var(--sys-color-on-surface);
            gap: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .search-widget .logo {
            font-size: 24px;
            font-weight: 700;
            color: white;
            letter-spacing: -1px;
        }

        /* Gesture Navigation Bar */
        .nav-bar {
            height: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-bottom: 8px;
            background: transparent;
        }

        .nav-pill {
            width: 108px;
            height: 4px;
            background-color: rgba(255,255,255,0.8);
            border-radius: 2px;
        }

    </style>
</head>
<body>

    <div class="device-screen">
        
        <!-- Status Bar -->
        <div class="status-bar">
            <div id="clock">12:00</div>
            <div class="status-icons">
                <span class="material-symbols-outlined">wifi</span>
                <span class="material-symbols-outlined">signal_cellular_4_bar</span>
                <span class="material-symbols-outlined">battery_full</span>
            </div>
        </div>

        <!-- At a Glance -->
        <div class="at-a-glance" id="date-widget">
            Lun, 1 Ene
        </div>

        <!-- Apps Grid -->
        <div class="app-grid" id="app-grid">
            <!-- Los iconos se inyectarán aquí -->
        </div>

        <!-- Search Widget -->
        <div class="search-widget">
            <span class="logo">G</span>
            <span style="opacity: 0.7; font-size: 16px; flex-grow: 1;">Buscar...</span>
            <span class="material-symbols-outlined">mic</span>
        </div>

        <!-- Gesture Navigation Bar -->
        <div class="nav-bar">
            <div class="nav-pill"></div>
        </div>

    </div>

    <script>
        // Reloj y Fecha real
        function updateTime() {
            const now = new Date();
            
            // Reloj
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            document.getElementById('clock').innerText = timeStr;

            // Fecha (At a Glance)
            const options = { weekday: 'short', month: 'short', day: 'numeric' };
            let dateStr = now.toLocaleDateString('es-ES', options);
            dateStr = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
            document.getElementById('date-widget').innerText = dateStr;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // Datos Fallback
        const fallbackGames = [
            { "id": "chrome", "name": "Chrome", "url": "./Chrome/index.html", "icon": "language" },
            { "id": "block-blast", "name": "Block Blast", "url": "https://pinkdev.d13qic2f6zga3.amplifyapp.com/games/clblockblast.html", "icon": "grid_view" },
            { "id": "bridge-race", "name": "Bridge Race", "url": "https://2220347414531419227.playables.usercontent.goog/v/assets/index.html", "icon": "construction" },
            { "id": "build-a-queen", "name": "Build a queen", "url": "https://10542200469832840160.playables.usercontent.goog/v/assets/index.html", "icon": "auto_awesome" },
            { "id": "burger-life", "name": "Burger Life", "url": "https://3724861607956707585.playables.usercontent.goog/v/assets/index.html", "icon": "lunch_dining" },
            { "id": "geometry-dash", "name": "Geometry Dash", "url": "", "icon": "bolt" },
            { "id": "going-balls", "name": "Going Balls", "url": "https://2382389492886359936.playables.usercontent.goog/v/assets/index.html", "icon": "sports_soccer" },
            { "id": "hole-io", "name": "Hole.io", "url": "https://2588800991068309738.playables.usercontent.goog/v/assets/index.html", "icon": "circle" },
            { "id": "phone-case-diy", "name": "Phone case DIY", "url": "https://15928053354325220490.playables.usercontent.goog/v/assets/index.html", "icon": "phone_iphone" },
            { "id": "pizza-ready", "name": "Pizza Ready!", "url": "https://5776750795450793656.playables.usercontent.goog/v/assets/index.html", "icon": "local_pizza" },
            { "id": "save-the-dogs", "name": "Save The Dogs", "url": "https://11031894482352440215.playables.usercontent.goog/v/assets/index.html", "icon": "pets" },
            { "id": "seek-n-hide", "name": "Seek N Hide", "url": "https://8328750458724478102.playables.usercontent.goog/v/assets/index.html", "icon": "visibility" },
            { "id": "supreme-duelist-stickman", "name": "Supreme Duelist Stickman", "url": "./Supreme%20Duelist%20Stickman/v/assets/index.html", "icon": "sports_kabaddi" },
            { "id": "worlds-of-wonders", "name": "Worlds of wonders", "url": "./Worlds%20of%20wonders/v/assets/index.html", "icon": "public" }
        ];

        async function loadApps() {
            const grid = document.getElementById('app-grid');
            let games = [];

            try {
                const res = await fetch('games.json');
                if (!res.ok) throw new Error();
                games = await res.json();
            } catch (e) {
                games = fallbackGames;
            }

            games.forEach(game => {
                const appItem = document.createElement('div');
                appItem.className = 'app-item';
                
                // Redirigir a game.html (el puente/lanzador) al hacer clic
                appItem.onclick = () => {
                    window.location.href = `game.html?id=${game.id}`;
                };

                appItem.innerHTML = `
                    <div class="app-icon">
                        <span class="material-symbols-outlined">${game.icon}</span>
                    </div>
                    <span class="app-name">${game.name}</span>
                `;
                
                grid.appendChild(appItem);
            });
        }

        window.onload = loadApps;
    </script>
</body>
</html>
