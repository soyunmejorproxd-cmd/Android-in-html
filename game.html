<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lanzando App...</title>
    
    <!-- Google Fonts & Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />
    
    <style>
        /* Paleta de colores base de Material Design 3 */
        :root {
            --md-sys-color-primary: #006874;
            --md-sys-color-on-primary: #ffffff;
            --md-sys-color-primary-container: #97f0ff;
            --md-sys-color-on-primary-container: #001f24;
            --md-sys-color-surface: #f8fdff;
            --md-sys-color-on-surface: #191c1d;
            --md-sys-color-surface-variant: #dbe4e6;
            --md-sys-color-on-surface-variant: #3f484a;
            --md-sys-color-scrim: #000000;
        }

        /* Modo Oscuro automático */
        @media (prefers-color-scheme: dark) {
            :root {
                --md-sys-color-primary: #4fd8eb;
                --md-sys-color-on-primary: #00363d;
                --md-sys-color-primary-container: #004f58;
                --md-sys-color-on-primary-container: #97f0ff;
                --md-sys-color-surface: #191c1d;
                --md-sys-color-on-surface: #e1e3e3;
                --md-sys-color-surface-variant: #3f484a;
                --md-sys-color-on-surface-variant: #bfc8ca;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
        }

        body {
            /* Un fondo ligeramente oscurecido como base detrás del scrim */
            background-color: var(--md-sys-color-surface-variant);
            color: var(--md-sys-color-on-surface);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            background-image: url('data:image/svg+xml;utf8,<svg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><circle cx="2" cy="2" r="2" fill="rgba(128,128,128,0.1)"/></svg>');
        }

        /* Scrim (Fondo oscuro borroso del pop-up) */
        .scrim {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            z-index: 1000;
        }

        /* M3 Dialog (El Pop-up) */
        .dialog {
            background-color: var(--md-sys-color-surface);
            border-radius: 28px; /* Radio típico de dialog en M3 */
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 8px 3px rgba(0,0,0,0.15), 0 1px 3px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 16px;
            animation: popIn 0.3s cubic-bezier(0.2, 0, 0, 1);
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .dialog-icon {
            color: var(--md-sys-color-primary);
            font-size: 32px;
            display: flex;
            justify-content: center;
            margin-bottom: 8px;
        }
        
        .dialog-icon span {
            font-size: 36px;
        }

        .dialog-title {
            font-size: 24px;
            font-weight: 400;
            color: var(--md-sys-color-on-surface);
            text-align: center;
        }

        .dialog-content {
            font-size: 14px;
            line-height: 20px;
            color: var(--md-sys-color-on-surface-variant);
            text-align: center;
            margin-bottom: 8px;
        }

        /* Linear Progress (Barra de progreso) */
        .progress-container {
            width: 100%;
            height: 4px;
            background-color: var(--md-sys-color-surface-variant);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 8px;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--md-sys-color-primary);
            border-radius: 2px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .status-text {
            font-size: 12px;
            color: var(--md-sys-color-primary);
            text-align: center;
            margin-top: 12px;
            font-weight: 500;
            height: 16px;
        }

        /* Actions (Botones) */
        .dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 16px;
        }

        .btn {
            height: 40px;
            padding: 0 24px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Text Button (Cancelar) */
        .btn-text {
            background: transparent;
            color: var(--md-sys-color-primary);
        }

        .btn-text:hover {
            background-color: rgba(0, 104, 116, 0.08); /* Opacidad en primary */
        }

        /* Filled Tonal Button (Abrir) */
        .btn-filled {
            background-color: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            opacity: 0.5;
            pointer-events: none;
        }

        .btn-filled.active {
            opacity: 1;
            pointer-events: auto;
        }

        .btn-filled.active:hover {
            box-shadow: 0 1px 2px rgba(0,0,0,0.3), 0 1px 3px 1px rgba(0,0,0,0.15);
        }
        
        /* Ocultar inicialmente para evitar parpadeos visuales */
        #main-dialog {
            display: none;
        }
    </style>
</head>
<body>

    <div class="scrim" id="scrim">
        <div class="dialog" id="main-dialog">
            
            <div class="dialog-icon">
                <span class="material-symbols-outlined" id="game-icon">rocket_launch</span>
            </div>
            
            <h2 class="dialog-title" id="game-title">Preparando Entorno</h2>
            
            <div class="dialog-content">
                Para garantizar un rendimiento óptimo y una experiencia fluida, la aplicación se ejecutará en una pestaña independiente dedicada, sin usar iframes.
            </div>
            
            <div>
                <div class="progress-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
                <div class="status-text" id="status-text">Iniciando protocolo de lanzamiento...</div>
            </div>

            <div class="dialog-actions">
                <button class="btn btn-text" onclick="window.history.back()">Cancelar</button>
                <button class="btn btn-filled" id="launch-btn">Abrir ahora</button>
            </div>
            
        </div>
    </div>

    <script>
        // Array de respaldo idéntico al de index.html por si games.json falla al ejecutarse en local (CORS)
        const fallbackGames = [
            { "id": "block-blast", "name": "Block Blast", "category": "Juegos", "url": "https://pinkdev.d13qic2f6zga3.amplifyapp.com/games/clblockblast.html", "icon": "grid_view" },
            { "id": "bridge-race", "name": "Bridge Race", "category": "Juegos", "url": "https://2220347414531419227.playables.usercontent.goog/v/assets/index.html", "icon": "construction" },
            { "id": "build-a-queen", "name": "Build a queen", "category": "Juegos", "url": "https://10542200469832840160.playables.usercontent.goog/v/assets/index.html", "icon": "auto_awesome" },
            { "id": "burger-life", "name": "Burger Life", "category": "Juegos", "url": "https://3724861607956707585.playables.usercontent.goog/v/assets/index.html", "icon": "lunch_dining" },
            { "id": "chrome", "name": "Chrome", "category": "Apps", "entry": "Chrome/index.html", "icon": "language" },
            { "id": "geometry-dash", "name": "Geometry Dash", "category": "Juegos", "url": "", "icon": "bolt" },
            { "id": "going-balls", "name": "Going Balls", "category": "Juegos", "url": "https://2382389492886359936.playables.usercontent.goog/v/assets/index.html", "icon": "sports_soccer" },
            { "id": "hole-io", "name": "Hole.io", "category": "Juegos", "url": "https://2588800991068309738.playables.usercontent.goog/v/assets/index.html", "icon": "circle" },
            { "id": "phone-case-diy", "name": "Phone case DIY", "category": "Juegos", "url": "https://15928053354325220490.playables.usercontent.goog/v/assets/index.html", "icon": "phone_iphone" },
            { "id": "pizza-ready", "name": "Pizza Ready!", "category": "Juegos", "url": "https://5776750795450793656.playables.usercontent.goog/v/assets/index.html", "icon": "local_pizza" },
            { "id": "save-the-dogs", "name": "Save The Dogs", "category": "Juegos", "url": "https://11031894482352440215.playables.usercontent.goog/v/assets/index.html", "icon": "pets" },
            { "id": "seek-n-hide", "name": "Seek N Hide", "category": "Juegos", "url": "https://8328750458724478102.playables.usercontent.goog/v/assets/index.html", "icon": "visibility" },
            { "id": "supreme-duelist-stickman", "name": "Supreme Duelist Stickman", "category": "Juegos", "entry": "Supreme Duelist Stickman/v/assets/index.html", "icon": "sports_kabaddi" },
            { "id": "worlds-of-wonders", "name": "Worlds of wonders", "category": "Juegos", "entry": "Worlds of wonders/v/assets/index.html", "icon": "public" }
        ];

        const urlParams = new URLSearchParams(window.location.search);
        const gameId = urlParams.get('id');
        let targetUrl = '';

        async function init() {
            let game = null;
            
            // Intentar cargar JSON original, usar fallback si falla
            try {
                const response = await fetch('games.json');
                if (!response.ok) throw new Error("Fetch failed");
                const games = await response.json();
                game = games.find(g => g.id === gameId);
            } catch (error) {
                console.warn("Ejecutando fallback de datos locales...");
                game = fallbackGames.find(g => g.id === gameId);
            }

            // Validar si el juego existe en el array
            if (!game) {
                showError("App no encontrada", "Verifica que el enlace sea correcto.");
                return;
            }

            targetUrl = game.url || game.entry;
            
            // Actualizar interfaz con los datos
            document.getElementById('game-title').innerText = `Lanzando ${game.name}`;
            document.getElementById('game-icon').innerText = game.icon || 'videogame_asset';
            document.getElementById('main-dialog').style.display = 'flex';

            // Validar si el juego tiene enlace asignado
            if (!targetUrl || targetUrl.trim() === "") {
                showError(`No hay enlace para ${game.name}`, "El enlace de este título está pendiente.");
                return;
            }

            // Iniciar simulación de optimización antes de abrir
            startOptimizationProcess();
        }

        function showError(title, message) {
            document.getElementById('game-title').innerText = title;
            document.getElementById('status-text').innerText = message;
            document.getElementById('status-text').style.color = "#ba1a1a"; // Color de error M3
            document.getElementById('progress-bar').style.backgroundColor = "#ba1a1a";
            document.getElementById('progress-bar').style.width = "100%";
            document.getElementById('main-dialog').style.display = 'flex';
        }

        function startOptimizationProcess() {
            const progressBar = document.getElementById('progress-bar');
            const statusText = document.getElementById('status-text');
            const launchBtn = document.getElementById('launch-btn');

            let step = 0;
            // Pasos simulados de verificación y "optimización"
            const steps = [
                { progress: 25, text: "Verificando integridad de la aplicación...", delay: 600 },
                { progress: 65, text: "Liberando recursos de la memoria local...", delay: 900 },
                { progress: 90, text: "Preparando entorno de ejecución externo...", delay: 700 },
                { progress: 100, text: "¡Entorno optimizado y listo!", delay: 400 }
            ];

            function nextStep() {
                if (step < steps.length) {
                    progressBar.style.width = steps[step].progress + "%";
                    statusText.innerText = steps[step].text;
                    
                    setTimeout(nextStep, steps[step].delay);
                    step++;
                } else {
                    // Proceso completado
                    launchBtn.classList.add('active');
                    
                    // Configurar el botón por si el bloqueador de ventanas impide el auto-lanzamiento
                    launchBtn.onclick = () => {
                        window.open(targetUrl, '_blank');
                        statusText.innerText = "Ventana lanzada. Ya puedes cerrar esta pestaña.";
                    };
                    
                    // Intentar lanzamiento automático
                    try {
                        const newWindow = window.open(targetUrl, '_blank');
                        // Detección de bloqueador de pop-ups básica
                        if (!newWindow || newWindow.closed || typeof newWindow.closed == 'undefined') {
                            statusText.innerText = "El navegador bloqueó la ventana. Haz clic en 'Abrir ahora'.";
                        } else {
                            statusText.innerText = "Lanzado con éxito. Puedes volver al catálogo.";
                            launchBtn.innerText = "Lanzar de nuevo";
                        }
                    } catch (e) {
                        statusText.innerText = "Haz clic en 'Abrir ahora' para comenzar a jugar.";
                    }
                }
            }

            // Dar un breve retraso inicial tras cargar el pop-up para sensación de fluidez
            setTimeout(nextStep, 400); 
        }

        // Arrancar al cargar el DOM
        window.onload = init;
    </script>
</body>
</html>
